[project]
name = "exsig"
version = "1.0.0"
description = "Offline SHA-256 + Ed25519 signature system for Exteragram .plugin files and .eaf bundles"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.scripts]
exsig = "exsig.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["exsig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
